AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Lyrpay - web dashboard (S3 + CloudFront), payments API (Lambda) and ledger (DynamoDB).

Parameters:
  PrimaryOrigin:
    Type: String
    Default: https://app.lyrpay.com
    Description: The site's main origin (the CloudFront domain until lyrpay.com points here). deploy.sh fills it in.
  UserPoolId:
    Type: String
    Default: us-east-1_elNSe2VTE
    Description: The Lyr account pool shared with Lyrtrip (email, mobile number and Google sign-in).
  FxFeeBps:
    Type: Number
    Default: 50
    Description: Spread on currency conversions in basis points.
  CertificateArn:
    Type: String
    Default: ''
    Description: Issued us-east-1 ACM certificate for lyrpay.com and www.lyrpay.com. Empty serves only the CloudFront domain.

  StripePublishableKey:
    Type: String
    Default: ''
    Description: Stripe publishable key (pk_...), for showing card details with Stripe.js once Issuing is on.
  CardTermsUrl:
    Type: String
    Default: ''
    Description: Link to the cardholder terms of your Stripe Issuing program, shown when someone gets a card.

Conditions:
  HasDomain: !Not [!Equals [!Ref CertificateArn, '']]

Globals:
  Function:
    Runtime: python3.12
    CodeUri: backend/
    MemorySize: 512
    Architectures: [x86_64]
    Environment:
      Variables:
        COGNITO_REGION: !Ref AWS::Region
        COGNITO_USER_POOL_ID: !Ref UserPoolId
        COGNITO_CLIENT_ID: !Ref WebClient
        LEDGER_TABLE: !Ref LedgerTable
        ALLOWED_ORIGINS: !Sub '${PrimaryOrigin},https://lyrpay.com,https://www.lyrpay.com,http://localhost:5173'
        STRIPE_SECRET_ID: lyrpay/stripe
        STRIPE_PUBLISHABLE_KEY: !Ref StripePublishableKey
        CARD_TERMS_URL: !Ref CardTermsUrl
        FX_FEE_BPS: !Ref FxFeeBps
        MAIL_SIGNING_SECRET_ID: !Ref MailSigningSecret
        SITE_URL: !Ref PrimaryOrigin

Resources:
  LedgerTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: lyrpay-ledger
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
        - { AttributeName: queue, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      # Sparse: only pending withdrawals and bank top-ups carry `queue`, so the sweep reads just those
      GlobalSecondaryIndexes:
        - IndexName: pending
          KeySchema:
            - { AttributeName: queue, KeyType: HASH }
            - { AttributeName: sk, KeyType: RANGE }
          Projection: { ProjectionType: KEYS_ONLY }
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  WebClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: lyrpay-web
      UserPoolId: !Ref UserPoolId
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      SupportedIdentityProviders: [COGNITO, Google]
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email, profile, phone]
      AllowedOAuthFlowsUserPoolClient: true
      CallbackURLs:
        - !Sub '${PrimaryOrigin}/auth/callback'
        - https://lyrpay.com/auth/callback
        - https://www.lyrpay.com/auth/callback
        - http://localhost:5173/auth/callback
      LogoutURLs:
        - !Ref PrimaryOrigin
        - https://lyrpay.com
        - https://www.lyrpay.com
        - http://localhost:5173
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true

  # Signs the unsubscribe links in Lyrpay emails
  MailSigningSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: lyrpay/mail-signing
      GenerateSecretString:
        PasswordLength: 48
        ExcludePunctuation: true

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: lyrpay-api
      Handler: app.lambda_handler.handler
      Timeout: 29
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref LedgerTable
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource:
                - !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:lyrpay/stripe-*'
                - !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:lyrpay/plaid-*'
                - !Ref MailSigningSecret
            - Effect: Allow
              Action: ses:SendEmail
              Resource: !Sub 'arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/lyrpay.com'
      FunctionUrlConfig:
        AuthType: NONE
      Events:
        # Keeps an instance warm: Stripe gives card authorizations 2 seconds, less than a cold start
        Warm:
          Type: Schedule
          Properties:
            Schedule: rate(5 minutes)
            Input: '{"warm": true}'

  # Finishes withdrawals Stripe didn't answer or Plaid hasn't posted yet, for people who don't open their wallet again
  SweepFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: lyrpay-withdrawal-sweep
      Handler: app.sweep.handler
      Timeout: 300
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref LedgerTable
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource:
                - !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:lyrpay/stripe-*'
                - !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:lyrpay/plaid-*'
      Events:
        Every15Minutes:
          Type: Schedule
          Properties:
            Schedule: rate(15 minutes)

  # Sends an announcement from app/mail.py UPDATES to every Lyr account; invoked by hand (README)
  UpdateEmailFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: lyrpay-send-update
      Handler: app.mail.handler
      Timeout: 900
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref LedgerTable
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref MailSigningSecret
            - Effect: Allow
              Action: ses:SendEmail
              Resource: !Sub 'arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/lyrpay.com'
            - Effect: Allow
              Action: cognito-idp:ListUsers
              Resource: !Sub 'arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${UserPoolId}'

  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub '${SiteBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}'

  SiteOac:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-site'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # Paths without a file extension are app routes (/login, /auth/callback), served by index.html
  SpaRewrite:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub '${AWS::StackName}-spa-rewrite'
      AutoPublish: true
      FunctionConfig:
        Comment: Serve index.html for app routes
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          if (!/\.[a-zA-Z0-9]+$/.test(request.uri)) request.uri = '/index.html';
          return request;
        }

  SecurityHeaders:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub '${AWS::StackName}-security'
        SecurityHeadersConfig:
          StrictTransportSecurity: { AccessControlMaxAgeSec: 63072000, IncludeSubdomains: true, Override: true }
          ContentTypeOptions: { Override: true }
          FrameOptions: { FrameOption: DENY, Override: true }
          ReferrerPolicy: { ReferrerPolicy: strict-origin-when-cross-origin, Override: true }

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: Lyrpay
        Aliases: !If [HasDomain, [lyrpay.com, www.lyrpay.com], !Ref AWS::NoValue]
        ViewerCertificate: !If
          - HasDomain
          - { AcmCertificateArn: !Ref CertificateArn, SslSupportMethod: sni-only, MinimumProtocolVersion: TLSv1.2_2021 }
          - !Ref AWS::NoValue
        HttpVersion: http2and3
        DefaultRootObject: index.html
        PriceClass: PriceClass_All
        Origins:
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !Ref SiteOac
            S3OriginConfig: { OriginAccessIdentity: '' }
          - Id: api
            DomainName: !Select [2, !Split ['/', !GetAtt ApiFunctionUrl.FunctionUrl]]
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
          ResponseHeadersPolicyId: !Ref SecurityHeaders
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt SpaRewrite.FunctionMetadata.FunctionARN
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: api
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # Managed-CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # Managed-AllViewerExceptHostHeader
            ResponseHeadersPolicyId: !Ref SecurityHeaders

Outputs:
  SiteUrl:
    Value: !If [HasDomain, 'https://lyrpay.com', !Sub 'https://${Distribution.DomainName}']
  DistributionId:
    Value: !Ref Distribution
  SiteBucketName:
    Value: !Ref SiteBucket
  ApiFunctionUrl:
    Value: !GetAtt ApiFunctionUrl.FunctionUrl
  UserPoolId:
    Value: !Ref UserPoolId
  UserPoolClientId:
    Value: !Ref WebClient

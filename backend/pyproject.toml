[project]
name = "lyrpay-backend"
version = "1.0.0"
description = "Lyrpay payments API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "pydantic>=2.8.0",
  "mangum>=0.19.0",
  "PyJWT[crypto]>=2.9.0",
  "boto3>=1.35.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Deploys Lyrpay (API, ledger and web dashboard) from GitHub's servers, so it can be started from a phone:
# Actions → Deploy → Run workflow. Needs the AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY repository secrets.
name: Deploy

on:
  workflow_dispatch:

# One deploy at a time; a second one waits rather than racing the first
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Backend tests
        working-directory: backend
        run: |
          pip install -r requirements-dev.txt
          pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy
        run: ./deploy.sh
